<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tile Layout — PrusArt</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#202428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tile Layout">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f1ec;--ink:#1e2226;--mut:#6a6f76;--line:#dcd6cc;--card:#fff;--acc:#d27a24;--hdr:#202428}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right));background:var(--hdr);color:#fff;position:sticky;top:0;z-index:6}
header .ttl{flex:1;min-width:0;line-height:1.15}
header .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ttl small{display:block;color:#aab0b8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#3a4047;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;min-width:38px}
header button.acc{background:var(--acc)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#e9e5dd;border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--ink)}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tabs button.add{border-style:dashed;color:var(--acc);border-color:var(--acc)}
#tabs button.all{border-color:#9aa3ad}
#stage{position:relative;height:56vh;min-height:300px;background:#fbfaf7;border-bottom:1px solid var(--line)}
#svg{width:100%;height:100%;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
#tools{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
#tools button{pointer-events:auto;border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:8px;padding:7px 8px;min-width:34px;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
#tools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tools .sp{flex:1}
#pad{position:absolute;right:6px;bottom:6px;display:grid;grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,32px);gap:3px;opacity:.92}
#pad button{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:8px;font-size:16px;padding:0;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);touch-action:none;-webkit-user-select:none;user-select:none}
#pad button.stp{font-size:11px;font-weight:700;color:var(--acc)}
#pad button:active{background:var(--ink);color:#fff}
@media(max-width:420px){#tools button{padding:6px 7px;font-size:12.5px;min-width:30px}#tools{gap:4px}}
#stat{padding:7px 10px;font-size:13px;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px}
#stat b{font-variant-numeric:tabular-nums}
#stat .bad{color:#b3261e;font-weight:600}
#legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:7px 10px;font-size:12px;color:var(--mut)}
#legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #8a847a;vertical-align:-3px;margin-right:4px}
#panel{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
summary{padding:12px 14px;font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--mut)}
details[open] summary::after{content:"－"}
.bd{padding:0 14px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .w2{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
label.f input,label.f select,textarea{font-size:16px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;font-family:inherit}
label.c{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
label.c input{width:20px;height:20px;flex:none}
input.bad{border-color:#d33!important;background:#fff3f2!important}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.d{color:#b3261e;border-color:#e8b9b5}
.btn.sm{padding:5px 8px;font-size:12px}
.btn.w{width:100%}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.hint{font-size:12px;color:var(--mut);margin:6px 0}
.note{font-size:12.5px;background:#fff6e8;border:1px solid #f0d9b5;border-radius:8px;padding:7px 9px;margin:8px 0}
.op{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#faf9f6}
.op h4{margin:0 0 6px;font-size:13px}
.pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px;justify-content:start}
.pad button{height:40px}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kp div{background:#f6f4ef;border-radius:8px;padding:8px}
.kp small{display:block;color:var(--mut);font-size:11px}
.kp b{font-size:17px;font-variant-numeric:tabular-nums}
.kp .hl{background:#fbe8d4}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #eee9e0;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;border:1px solid #8a847a}
.warnbox{background:#fdecea;color:#8c1d18;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.dl{font-size:13px;padding:6px 0;border-bottom:1px solid #eee9e0}
#modal{position:fixed;inset:0;background:rgba(20,22,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.mbox{background:#fff;width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.mbox h3{margin:0 0 10px}
.mbox img{width:100%;border:1px solid var(--line);border-radius:8px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;font-size:11.5px;line-height:1.2;cursor:pointer;color:var(--ink);text-align:center}
.gal button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.gal svg{width:100%;aspect-ratio:1;border-radius:6px;display:block}
.pl{display:flex;align-items:center;gap:6px;border-bottom:1px solid #eee;padding:8px 0}
.pl .nm{flex:1;min-width:0}
.pl .nm small{display:block;color:var(--mut)}
#clientCard{display:none;padding:10px}
.cc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}
body.client #panel{display:none}
body.client #clientCard{display:block}
body.client #stage{height:66vh}
body.client .ed{display:none!important}
body.tot #stage,body.tot #stat,body.tot #legend{display:none}
@media(min-width:900px){
 #app{display:flex;height:calc(100vh - 50px - env(safe-area-inset-top))}
 #vw{flex:1;display:flex;flex-direction:column;min-width:0}
 #stage{flex:1;height:auto}
 #panel{width:420px;overflow:auto;border-left:1px solid var(--line)}
 .mbox{border-radius:16px;margin:auto}
 #modal{align-items:center}
 body.client #stage{height:auto}
 .gal{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<header>
 <div class="ttl"><b id="hT"></b><small id="hS"></small></div>
 <button data-act="lang" id="bLang"></button>
 <button data-act="projects" class="ed" id="bProj"></button>
 <button data-act="image" id="bImg"></button>
 <button data-act="client" class="acc" id="bCli"></button>
</header>
<div id="app">
 <section id="vw">

  <div id="stage">

  </div>
  <div id="stat"></div>
  <div id="legend"></div>
  <div id="clientCard"></div>
 </section>
 <aside id="panel"></aside>
</div>
<div id="modal" hidden><div class="mbox" id="mbody"></div></div>

function parseLen(s){

 if(!s)return NaN;

function fmtIn(x){if(!isFinite(x))return '';const neg=x<0;x=Math.abs(x);const n=Math.round(x*16);const w=Math.floor(n/16);let f=n%16,d=16;
 if(!f)return (neg?'-':'')+w;while(f%2===0){f/=2;d/=2;}return (neg?'-':'')+(w?w+' ':'')+f+'/'+d;}

/* ================= geometry ================= */
const rectPoly=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function sArea(p){let a=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1];}return a/2;}
const polyArea=p=>p.length<3?0:Math.abs(sArea(p));
function bboxOf(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of p){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1];}return{x0,y0,x1,y1};}
function circlePoly(cx,cy,r,n=32){const o=[];for(let i=0;i<n;i++){const a=2*Math.PI*i/n;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;}
function rotP(p,o,a){const c=Math.cos(a),s=Math.sin(a),dx=p[0]-o[0],dy=p[1]-o[1];return[o[0]+c*dx-s*dy,o[1]+s*dx+c*dy];}
function clipConvex(subj,clip){let out=subj;
 for(let i=0;i<clip.length&&out.length;i++){const A=clip[i],B=clip[(i+1)%clip.length],ex=B[0]-A[0],ey=B[1]-A[1];
  const side=q=>ex*(q[1]-A[1])-ey*(q[0]-A[0]);const inp=out;out=[];
  for(let k=0;k<inp.length;k++){const a=inp[k],b=inp[(k+1)%inp.length],sa=side(a),sb=side(b);
   if(sa>=-1e-9){out.push(a);if(sb<-1e-9){const u=sa/(sa-sb);out.push([a[0]+u*(b[0]-a[0]),a[1]+u*(b[1]-a[1])]);}}
   else if(sb>=-1e-9){const u=sa/(sa-sb);out.push([a[0]+u*(b[0]-a[0]),a[1]+u*(b[1]-a[1])]);}}}
 return out;}
function pip(p,x,y){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function parsePts(str){return String(str||'').split(/[;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.split(',');return[parseLen(m[0]),parseLen(m[1]||'')];}).filter(q=>isFinite(q[0])&&isFinite(q[1]));}
const isTub=s=>s.type==='wall'&&s.shape==='rect'&&s.tub&&s.tub.on;
const isUneven=s=>s.type==='wall'&&s.shape==='rect'&&s.uneven&&s.uneven.on&&!isTub(s);
const isZLinked=s=>s.type!=='wall'&&!!s.zlink;
const isPlumb=s=>s.type==='wall'&&s.shape==='rect'&&s.plumb&&s.plumb.on;
const isShaped=s=>isUneven(s)||isPlumb(s)||isTub(s);
function tubDims(s){const tb=s.tub,W=s.w,d=Math.max(0,Math.min(+tb.d||0,W)),h=+tb.h||0,r=Math.max(0,Math.min(+tb.r||0,d*0.9,h*0.9));return{W,d,xs:W-d,h,r,hF:h+(+tb.rF||0),hB:h+(+tb.rB||0)};}
function tubChain(s){const{W,xs,r,hF,hB}=tubDims(s);const pts=[[0,0]];if(xs>0.01)pts.push([xs,0]);
 if(r>0.05){const cx=xs+r,cy=hF-r;for(let k=0;k<=10;k++){const th=Math.PI-k*(Math.PI/2)/10;pts.push([cx+r*Math.cos(th),cy+r*Math.sin(th)]);}}else pts.push([xs,hF]);
 pts.push([W,hB]);const out=s.tub.side==='l'?pts.map(q=>[W-q[0],q[1]]).reverse():pts;
 return out.filter((q,i)=>i===0||Math.hypot(q[0]-out[i-1][0],q[1]-out[i-1][1])>1e-6);}
function tubArc(s){if(!isTub(s))return null;const{W,xs,r,hF}=tubDims(s);if(r<=0.05)return null;const c=[xs+r,hF-r];return{c:s.tub.side==='l'?[W-c[0],c[1]]:c,r,side:s.tub.side};}
function clipChainX(ch,x0,x1){const out=[];for(let i=0;i<ch.length;i++){const p=ch[i];if(p[0]>=x0-1e-9&&p[0]<=x1+1e-9)out.push(p);
  if(i<ch.length-1){const q=ch[i+1];const xs2=[x0,x1].filter(xc=>(p[0]-xc)*(q[0]-xc)<0);if(q[0]<p[0])xs2.reverse();for(const xc of xs2){const u=(xc-p[0])/(q[0]-p[0]);out.push([xc,p[1]+u*(q[1]-p[1])]);}}}
 return out;}
function wallPoly(s,inL,inR,inT,inB){const W=s.w,H=s.h,lt=isPlumb(s)?+s.plumb.l||0:0,rt=isPlumb(s)?+s.plumb.r||0:0;

function botY(s,x){const u=s.uneven,W=s.w,l=+u.l||0,r=+u.r||0;if(u.mOn){const m=+u.m||0;return x<=W/2?l+(m-l)*(x/(W/2)):m+(r-m)*((x-W/2)/(W/2));}return l+(r-l)*(x/W);}
function botPts(s,x0,x1){const pts=[[x0,botY(s,x0)]];if(s.uneven.mOn&&x0<s.w/2&&x1>s.w/2)pts.push([s.w/2,botY(s,s.w/2)]);pts.push([x1,botY(s,x1)]);return pts;}
function walkPoly(s){const segs=s.segs||[];let x=0,y=0,h=0;const raw=[[0,0]];
 segs.forEach((g,i)=>{const L=+g.l||0;x+=L*Math.cos(h);y+=L*Math.sin(h);raw.push([x,y]);h+=(+g.a||0)*Math.PI/180;});
 const gap=Math.hypot(x,y);let pts=raw.slice(0,-1);if(gap>0.05)pts=raw.slice();
 const edges=[];for(let i=0;i<segs.length;i++)edges.push([raw[i],raw[i+1]]);
 const mnx=Math.min(...pts.map(q=>q[0])),mny=Math.min(...pts.map(q=>q[1]));const sh=q=>[q[0]-mnx,q[1]-mny];
 const P2=pts.map(sh);return{pts:P2,edges:edges.map(e=>[sh(e[0]),sh(e[1])]),gap,ccw:sArea(P2)>0};}
function polyToSegs(pts){let p=pts.slice();if(sArea(p)<0)p=p.reverse();const n=p.length,out=[];
 for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n],c=p[(i+2)%n];const h1=Math.atan2(b[1]-a[1],b[0]-a[0]),h2=Math.atan2(c[1]-b[1],c[0]-b[0]);let d=(h2-h1)*180/Math.PI;while(d>180)d-=360;while(d<-180)d+=360;
  out.push({l:Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])*16)/16,a:Math.round(d*10)/10});}
 const i0=p.reduce((bi,q,i)=>(q[1]<p[bi][1]-1e-6||(Math.abs(q[1]-p[bi][1])<1e-6&&q[0]<p[bi][0]))?i:bi,0);return out.slice(i0).concat(out.slice(0,i0));}
function outerPoly(s){

 if(s.shape==='L'){const W=s.w,H=s.h,a=Math.max(0.5,Math.min(s.Lw,W-0.5)),b=Math.max(0.5,Math.min(s.Lh,H-0.5));
  let p=[[0,0],[W,0],[W,H-b],[W-a,H-b],[W-a,H],[0,H]];const c=s.Lc||'tr';
  if(c==='tl'||c==='bl')p=p.map(q=>[W-q[0],q[1]]);if(c==='br'||c==='bl')p=p.map(q=>[q[0],H-q[1]]);return p;}
 if(s.shape==='walk'){const wk=walkPoly(s);if(wk.pts.length>=3&&polyArea(wk.pts)>1)return wk.pts;}
 if(s.shape==='custom'){const p=parsePts(s.pts);if(p.length>=3&&polyArea(p)>1)return p;}

/* ================= tile engine ================= */
function patOf(T){if(T.shape==='hex')return'hex';if(T.shape==='chevron')return'chevron';if(T.shape==='penny')return T.pattern==='offset'?'offset':'grid';return T.pattern||'grid';}
function angOf(T){return((+T.ang||0)+(T.shape==='hex'&&T.rot?90:0))*Math.PI/180;}
function rdims(T){if(T.shape==='penny')return{tw:+T.w,th:+T.w};return{tw:T.rot?+T.h:+T.w,th:T.rot?+T.w:+T.h};}
function tileDesc(T){const s=T.shape;let d;
 if(s==='hex')d='Hex '+fmt(+T.w);else if(s==='penny')d='Penny '+fmt(+T.w);else if(s==='chevron')d='Chevron '+fmtIn(+T.w)+'×'+fmtIn(+T.h);
 else if(patOf(T)==='pinwheel')d=fmtIn(+T.w)+'×'+fmtIn(+T.w)+' + '+fmtIn(+T.w2)+'×'+fmtIn(+T.w2);
 else d=fmtIn(Math.min(+T.w,+T.h))+'×'+fmtIn(Math.max(+T.w,+T.h));
 if(T.sheet&&T.sheet.on)d+=' ('+(lang==='ru'?'лист ':'sheet ')+fmtIn(+T.sheet.w)+'×'+fmtIn(+T.sheet.h)+')';return d;}

function offShift(T,j,f){if(!f)return 0;const d=T.offDir||'r';return d==='a'?mod(j,2)*f:d==='l'?mod(-j*f,1):mod(j*f,1);}
function genTiles(T,bb){

 const LIM=16000;
 const R=(x,y,w,h,k,q)=>out.push({x0:x,y0:y,lw:w,lh:h,k:k||'r',q:q||0});
 if(pat==='hex'){const F=+T.w;if(!(F>0.2))return null;const s=F/Math.sqrt(3),px=F+g,py=1.5*s+g*Math.sqrt(3)/2;
  if((W/px+3)*(H/py+3)>LIM)return null;
  const j0=Math.floor((bb.y0-O[1])/py)-1,j1=Math.ceil((bb.y1-O[1])/py)+1;
  for(let j=j0;j<=j1;j++){const cy=O[1]+j*py,sh=mod(j,2)*px/2,i0=Math.floor((bb.x0-O[0]-sh)/px)-1,i1=Math.ceil((bb.x1-O[0]-sh)/px)+1;
   for(let i=i0;i<=i1;i++){const cx=O[0]+sh+i*px,poly=[];for(let k=0;k<6;k++){const a=Math.PI/6+k*Math.PI/3;poly.push([cx+s*Math.cos(a),cy+s*Math.sin(a)]);}
    out.push({x0:cx-F/2,y0:cy-s,lw:F,lh:2*s,poly,k:'p',q:mod(i+j,2)});}}
  return out;}
 if(pat==='chevron'){const cw=+T.w,eh=+T.h,sl=Math.tan(Math.min(75,Math.max(10,+T.cang||45))*Math.PI/180),rise=cw*sl,px=cw+g,py=eh+g;
  if(!(cw>0.2&&eh>0.2))return null;if((W/px+3)*((H+rise)/py+3)>LIM)return null;
  const i0=Math.floor((bb.x0-O[0])/px)-1,i1=Math.ceil((bb.x1-O[0])/px)+1;
  for(let i=i0;i<=i1;i++){const x0=O[0]+i*px,odd=mod(i,2)===1,yl=odd?rise:0,yr=odd?0:rise;
   const j0=Math.floor((bb.y0-O[1]-rise)/py)-1,j1=Math.ceil((bb.y1-O[1])/py)+1;
   for(let j=j0;j<=j1;j++){const y=O[1]+j*py;out.push({x0,y0:y,lw:cw,lh:eh+rise,poly:[[x0,y+yl],[x0+cw,y+yr],[x0+cw,y+yr+eh],[x0,y+yl+eh]],k:'p',q:mod(j,2)});}}
  return out;}

  const cs=[[bb.x0,bb.y0],[bb.x1,bb.y0],[bb.x0,bb.y1],[bb.x1,bb.y1]].map(p=>[p[0]-O[0],p[1]-O[1]]);
  const ks=cs.map(p=>(p[0]+p[1])/(2*A)),ms=cs.map(p=>(p[0]-p[1])/(2*B));
  for(let m=Math.floor(Math.min(...ms))-2;m<=Math.ceil(Math.max(...ms))+2;m++)for(let k=Math.floor(Math.min(...ks))-3;k<=Math.ceil(Math.max(...ks))+3;k++){
   const x=O[0]+k*A+m*B,y=O[1]+k*A-m*B;R(x,y,L,Wd,kind,0);R(x+B,y-(L-Wd),Wd,L,kind,1);}
  return out;}

  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const bx=O[0]+i*Bs,by=O[1]+j*Bs,q=mod(i+j,2);
   for(let k=0;k<n;k++){if(!q)R(bx,by+k*(Wd+g),L,Wd,kind,0);else R(bx+k*(Wd+g),by,Wd,L,kind,1);}}

  const cs=[[bb.x0,bb.y0],[bb.x1,bb.y0],[bb.x0,bb.y1],[bb.x1,bb.y1]].map(p=>[p[0]-O[0],p[1]-O[1]]);
  const c1=cs.map(p=>(A*p[0]+Bb*p[1])/det),c2=cs.map(p=>(-Bb*p[0]+A*p[1])/det);
  for(let u=Math.floor(Math.min(...c1))-2;u<=Math.ceil(Math.max(...c1))+2;u++)for(let v=Math.floor(Math.min(...c2))-2;v<=Math.ceil(Math.max(...c2))+2;v++){
   const x=O[0]+u*A-v*Bb,y=O[1]+u*Bb+v*A;R(x,y,a,a,kind,0);R(x+A-Bb,y+A,b,b,kind,1);}
  return out;}
 // grid / offset rows / offset columns
 let px=tw+g,py=th+g;const f=pat==='grid'?0:+(T.off==null?0.5:T.off);

  for(let i=i0;i<=i1;i++){const x=O[0]+i*px,sh=offShift(T,i,f)*py,j0=Math.floor((bb.y0-O[1]-sh)/py)-1,j1=Math.ceil((bb.y1-O[1]-sh)/py)+1;for(let j=j0;j<=j1;j++)R(x,O[1]+sh+j*py,tw,th,kind,mod(i+j,2));}
  return out;}
 const j0=Math.floor((bb.y0-O[1])/py)-1,j1=Math.ceil((bb.y1-O[1])/py)+1;
 for(let j=j0;j<=j1;j++){const y=O[1]+j*py,sh=offShift(T,j,f)*px,i0=Math.floor((bb.x0-O[0]-sh)/px)-1,i1=Math.ceil((bb.x1-O[0]-sh)/px)+1;for(let i=i0;i<=i1;i++)R(O[0]+sh+i*px,y,tw,th,kind,mod(i+j,2));}
 return out;}

function cellBox(C,holes,x0,y0,x1,y1){
 const xs=new Set([x0,x1]),ys=new Set([y0,y1]);C.forEach(q=>{xs.add(q[0]);ys.add(q[1]);});
 holes.forEach(h=>h.L.forEach(v=>{if(v[0]>x0&&v[0]<x1)xs.add(v[0]);if(v[1]>y0&&v[1]<y1)ys.add(v[1]);}));

 const wasPlain=prev==='rect'&&!(T.sheet&&T.sheet.on);if(wasPlain)T.mem={w:+T.w,h:+T.h};

function autoLayoutX(s){const T0=effT(s),sp=spanOf(T0),T=effT(s),start=T.ox;if(P.link.mode==='wrap')return;let best=null;const N=Math.min(240,Math.max(8,Math.round(sp.x/0.125)));

function matSettingsHTML(){
 return`<details data-sec="matset" ${S.open.has('matset')?'open':''} style="margin-top:10px"><summary>${t('matSettings')}</summary><div class="bd"><div class="grid">${SEL(t('wpSys'),'mat.wp',['kerdi','liquid','none'],1,'p','w2',o=>t('w'+o))}
 ${F(t('covS'),'mat.covS','num','p')}${F(t('covM'),'mat.covM','num','p')}${F(t('covL'),'mat.covL','num','p')}${F(t('groutBagLb'),'mat.groutBag','num','p')}${F(t('membRoll'),'mat.roll','num','p')}${F(t('liqSf'),'mat.liq','num','p')}${F(t('ditraRoll'),'mat.ditraSf','num','p')}${F(t('silLf'),'mat.silLf','num','p')}</div>
 ${CHK(t('clipsOn'),'mat.clips',0,'p')}</div></details>`;}
function jointPerArea(T){const s=T.shape;if(s==='hex'){const sd=(+T.w)/Math.sqrt(3);return 2/(Math.sqrt(3)*sd);}if(s==='penny')return 2.8/(+T.w);
 if(patOf(T)==='pinwheel'){const a=+T.w,b=+T.w2;return(2*a+2*b)/(a*a+b*b);}const L=+T.w,W=+T.h||+T.w;return(L+W)/(L*W);}
function trowelOf(T){const mx=T.sheet&&T.sheet.on?Math.max(+T.w,+T.h||+T.w):(T.shape==='hex'?+T.w*1.15:Math.max(+T.w,+T.h||+T.w,+T.w2||0));return mx<=8?'s':mx<=16?'m':'l';}
function materials(){const m=P.mat,rows=[];const thin={s:0,m:0,l:0};let grout=0,wetSf=0,wallSf=0,floorSf=0,clips=0,lf=0,valves=0,pipes=0,niches=0,band=0,sil=0,curbs=0;
 const wetWalls=P.surfaces.filter(s=>s.type==='wall'&&s.wet);
 for(const s of P.surfaces){const R=compute(s),T=R.T,sf=R.area/144,tr=trowelOf(T);
  thin[tr]+=sf*(tr==='l'?m.bb:1);
  grout+=sf*144*jointPerArea(T)*(+T.g||0.125)*(+T.thick||0.375)*m.dens*1.1;
  if(s.wet)wetSf+=sf;if(s.type==='wall')wallSf+=sf;if(s.type==='floor')floorSf+=sf;
  if(m.clips&&T.shape==='rect'&&!(T.sheet&&T.sheet.on)&&Math.max(+T.w,+T.h)>=12)clips+=R.need*2;
  lf+=R.lf;
  s.openings.forEach(o=>{if(o.type==='valve')valves++;if(o.type==='pipe')pipes++;if(o.type==='niche'&&s.wet){niches++;band+=4*(o.w+o.h);}});
  if(s.type==='pan'&&s.wet){band+=s.w+2*s.h;if(s.curb.on){band+=2*s.curb.len;curbs++;}}}
 const H=wetWalls.length?Math.max(...wetWalls.map(w=>bboxOf(outerPoly(w)).y1)):0;
 if(wetWalls.length>1){band+=(wetWalls.length-1)*H;sil+=(wetWalls.length-1)*H;}
 sil+=wetWalls.reduce((a,w)=>a+wallW(w),0);
 const bagsOf=(sf,cov)=>Math.ceil(sf/cov*1.05);
 const tn={s:'1/4×1/4',m:'1/4×3/8',l:'1/2×1/2'},cov={s:m.covS,m:m.covM,l:m.covL};

  if(len<10){DRAW.pts.push(st[0]);}else{const diag=Math.hypot(DRAW.W,DRAW.H);const simp=rdp(st,diag*0.025);const add=DRAW.pts.length&&Math.hypot(simp[0][0]-DRAW.pts[DRAW.pts.length-1][0],simp[0][1]-DRAW.pts[DRAW.pts.length-1][1])<diag*0.05?simp.slice(1):simp;DRAW.pts.push(...add);}

function rdp(pts,eps){if(pts.length<3)return pts.slice();const a=pts[0],b=pts[pts.length-1];let mx=-1,ix=0;const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1e-9;

 for(let i=1;i<P2.length-1;i++){const a=P2[i-1],b=P2[i],c=P2[i+1];const h1=Math.atan2(-(b[1]-a[1]),b[0]-a[0]),h2=Math.atan2(-(c[1]-b[1]),c[0]-b[0]);let d=Math.round((h2-h1)*180/Math.PI);while(d>180)d-=360;while(d<-180)d+=360;const ang=180-Math.abs(d);h+=`<text x="${b[0]+8}" y="${b[1]-8}" font-size="13" font-weight="700" fill="#2f6fab" font-family="${FONT}" paint-order="stroke" stroke="#fbfaf7" stroke-width="3">${ang}°</text>`;}

const SNAPS=(()=>{const a=new Set();for(let d=-180;d<=180;d+=30)a.add(d);for(let d=-180;d<=180;d+=45)a.add(d);return[...a];})();
function snapDeg(d){while(d>180)d-=360;while(d<-180)d+=360;let best=null;for(const c of SNAPS){const df=Math.abs(d-c),tol=c%90===0?15:9;if(df<=tol&&(!best||df<best.df-0.01||(Math.abs(df-best.df)<=0.01&&c%90===0)))best={c,df};}return best?best.c:Math.round(d);}
function snapPolyline(pts){if(pts.length<2)return pts.slice();const out=[pts[0].slice()];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]);const h=snapDeg(Math.atan2(-(b[1]-a[1]),b[0]-a[0])*180/Math.PI)*Math.PI/180;const pr=out[out.length-1];out.push([pr[0]+L*Math.cos(h),pr[1]-L*Math.sin(h)]);}return out;}
function straighten(raw,target){let P0=raw.map(q=>[q[0],-q[1]]);const bb=bboxOf(P0),diag=Math.hypot(bb.x1-bb.x0,bb.y1-bb.y0)||1;

 while(M.length>3&&Math.hypot(M[0][0]-M[M.length-1][0],M[0][1]-M[M.length-1][1])<diag*0.1)M.pop();
 if(M.length<3)return null;const n=M.length,hs=[],L0=[];
 for(let i=0;i<n;i++){const a=M[i],b=M[(i+1)%n];let d=snapDeg(Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI);hs.push(d*Math.PI/180);L0.push(Math.hypot(b[0]-a[0],b[1]-a[1]));}

 const P2=[];let fwd=Math.abs(cB-B0)<=Math.abs(cB-B1);let runLen=0;
 lines.forEach(ln=>{const iv=fwd?ln.iv:ln.iv.slice().reverse().map(q=>[q[1],q[0]]);iv.forEach(q=>{const a=q[0],b=q[1];P2.push(horiz?[a,ln.v]:[ln.v,a],horiz?[b,ln.v]:[ln.v,b]);runLen+=Math.abs(b-a);});fwd=!fwd;});
 let len=0;for(let i=1;i<P2.length;i++)len+=Math.hypot(P2[i][0]-P2[i-1][0],P2[i][1]-P2[i-1][1]);
 let sensor=null;if(lines.length>=2){const k=Math.floor((lines.length-1)/2),l1=lines[k],l2=lines[k+1],iv=l1.iv[0],m=(iv[0]+iv[1])/2,v=(l1.v+l2.v)/2;sensor=horiz?[m,v]:[v,m];}
 const watts=sf*wsf,volt=+H.volt||120,amps=watts/volt;
 const irregular=s.shape!=='rect'||s.openings.some(o=>o.type!=='duct');
 return{sf,sp,wsf,path:P2,lenFt:len/12,runs:lines.length,sensor,conn,watts,amps,volt,irregular,cableSf:Math.floor(sf)};}
function heatSVG(s,R,px){const hp=R.heat;if(!hp||!s.heat.show)return'';let h='';
 if(hp.path.length>1)h+=`<polyline points="${hp.path.map(q=>q[0].toFixed(2)+','+(-q[1]).toFixed(2)).join(' ')}" fill="none" stroke="#d6331f" stroke-width="${px(1.6)}" stroke-linejoin="round" opacity=".9"/>`;
 const c=hp.conn;if(hp.path.length)h+=`<line x1="${c[0]}" y1="${-c[1]}" x2="${hp.path[0][0]}" y2="${-hp.path[0][1]}" stroke="#1d5fa8" stroke-width="${px(1.6)}" stroke-dasharray="${px(5)} ${px(3)}"/>`;
 h+=`<rect x="${c[0]-+px(9)}" y="${-c[1]-+px(9)}" width="${px(18)}" height="${px(18)}" rx="${px(3)}" fill="#1d5fa8"/><text x="${c[0]}" y="${-c[1]}" font-size="${px(11)}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700" font-family="${FONT}">T</text>`;
 if(hp.sensor)h+=`<circle cx="${hp.sensor[0]}" cy="${-hp.sensor[1]}" r="${px(6)}" fill="#fff" stroke="#1d5fa8" stroke-width="${px(1.5)}"/><text x="${hp.sensor[0]}" y="${-hp.sensor[1]}" font-size="${px(8)}" text-anchor="middle" dominant-baseline="central" fill="#1d5fa8" font-weight="700" font-family="${FONT}">S</text>`;
 return h;}
function heatResHTML(s,R){const hp=R.heat;if(!hp)return'';const H=s.heat,ruSys=t('hs_'+H.sys);
 let h=`<p style="margin:12px 0 4px"><b>🔥 ${t('heat')}</b> · ${esc(ruSys)}</p><div class="kp"><div><small>${t('heatSf')}</small><b>${hp.sf.toFixed(1)}</b></div><div><small>${t('wsf')}</small><b>${hp.wsf}</b></div><div><small>${t('watts')}</small><b>${Math.round(hp.watts)}</b></div><div><small>${t('amps')} (${hp.volt}V)</small><b>${hp.amps.toFixed(1)}</b></div><div><small>${t('runs')}</small><b>${hp.runs}</b></div><div><small>${t('cableLen')}</small><b>${Math.round(hp.lenFt)} ft</b></div></div>`;
 h+=`<div class="note">${t('cablePick')} <b>${hp.cableSf} sf</b>. ${t('cableNoCut')}</div>`;
 if(hp.volt===120&&hp.sf>150)h+=`<div class="warnbox">${t('heat120warn')}</div>`;
 if(H.sys==='mat'&&hp.irregular)h+=`<div class="note">${t('matIrregular')}</div>`;
 h+=`<p class="hint">${t('heatNotes')}</p>`;return h;}
