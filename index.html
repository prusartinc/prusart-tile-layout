<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tile Layout — PrusArt</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#202428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tile Layout">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f1ec;--ink:#1e2226;--mut:#6a6f76;--line:#dcd6cc;--card:#fff;--acc:#d27a24;--hdr:#202428}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right));background:var(--hdr);color:#fff;position:sticky;top:0;z-index:6}
header .ttl{flex:1;min-width:0;line-height:1.15}
header .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ttl small{display:block;color:#aab0b8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#3a4047;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;min-width:38px}
header button.acc{background:var(--acc)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#e9e5dd;border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--ink)}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tabs button.add{border-style:dashed;color:var(--acc);border-color:var(--acc)}
#tabs button.all{border-color:#9aa3ad}
#stage{position:relative;height:56vh;min-height:300px;background:#fbfaf7;border-bottom:1px solid var(--line)}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#tools{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
#tools button{pointer-events:auto;border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:8px;padding:7px 8px;min-width:34px;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
#tools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tools .sp{flex:1}
@media(max-width:420px){#tools button{padding:6px 7px;font-size:12.5px;min-width:30px}#tools{gap:4px}}
#stat{padding:7px 10px;font-size:13px;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px}
#stat b{font-variant-numeric:tabular-nums}
#stat .bad{color:#b3261e;font-weight:600}
#legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:7px 10px;font-size:12px;color:var(--mut)}
#legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #8a847a;vertical-align:-3px;margin-right:4px}
#panel{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
summary{padding:12px 14px;font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--mut)}
details[open] summary::after{content:"－"}
.bd{padding:0 14px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .w2{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
label.f input,label.f select,textarea{font-size:16px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;font-family:inherit}
label.c{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
label.c input{width:20px;height:20px;flex:none}
input.bad{border-color:#d33!important;background:#fff3f2!important}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.d{color:#b3261e;border-color:#e8b9b5}
.btn.sm{padding:5px 8px;font-size:12px}
.btn.w{width:100%}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.hint{font-size:12px;color:var(--mut);margin:6px 0}
.note{font-size:12.5px;background:#fff6e8;border:1px solid #f0d9b5;border-radius:8px;padding:7px 9px;margin:8px 0}
.op{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#faf9f6}
.op h4{margin:0 0 6px;font-size:13px}
.pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px;justify-content:start}
.pad button{height:40px}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kp div{background:#f6f4ef;border-radius:8px;padding:8px}
.kp small{display:block;color:var(--mut);font-size:11px}
.kp b{font-size:17px;font-variant-numeric:tabular-nums}
.kp .hl{background:#fbe8d4}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #eee9e0;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;border:1px solid #8a847a}
.warnbox{background:#fdecea;color:#8c1d18;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.dl{font-size:13px;padding:6px 0;border-bottom:1px solid #eee9e0}
#modal{position:fixed;inset:0;background:rgba(20,22,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.mbox{background:#fff;width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.mbox h3{margin:0 0 10px}
.mbox img{width:100%;border:1px solid var(--line);border-radius:8px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;font-size:11.5px;line-height:1.2;cursor:pointer;color:var(--ink);text-align:center}
.gal button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.gal svg{width:100%;aspect-ratio:1;border-radius:6px;display:block}
.pl{display:flex;align-items:center;gap:6px;border-bottom:1px solid #eee;padding:8px 0}
.pl .nm{flex:1;min-width:0}
.pl .nm small{display:block;color:var(--mut)}
#clientCard{display:none;padding:10px}
.cc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}
body.client #panel{display:none}
body.client #clientCard{display:block}
body.client #stage{height:66vh}
body.client .ed{display:none!important}
body.tot #stage,body.tot #stat,body.tot #legend{display:none}
@media(min-width:900px){
 #app{display:flex;height:calc(100vh - 50px - env(safe-area-inset-top))}
 #vw{flex:1;display:flex;flex-direction:column;min-width:0}
 #stage{flex:1;height:auto}
 #panel{width:420px;overflow:auto;border-left:1px solid var(--line)}
 .mbox{border-radius:16px;margin:auto}
 #modal{align-items:center}
 body.client #stage{height:auto}
 .gal{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<header>
 <div class="ttl"><b id="hT"></b><small id="hS"></small></div>
 <button data-act="lang" id="bLang"></button>
 <button data-act="projects" class="ed" id="bProj"></button>
 <button data-act="image" id="bImg"></button>
 <button data-act="client" class="acc" id="bCli"></button>
</header>
<div id="app">

  </div>
  <div id="stat"></div>
  <div id="legend"></div>
  <div id="clientCard"></div>
 </section>
 <aside id="panel"></aside>
</div>
<div id="modal" hidden><div class="mbox" id="mbody"></div></div>

/* ================= geometry ================= */

/* ================= tile engine ================= */

function genTiles(T,bb){

 const LIM=16000;
 const R=(x,y,w,h,k,q)=>out.push({x0:x,y0:y,lw:w,lh:h,k:k||'r',q:q||0});

  if((W/px+3)*(H/py+3)>LIM)return null;

  for(let j=j0;j<=j1;j++){const cy=O[1]+j*py,sh=mod(j,2)*px/2,i0=Math.floor((bb.x0-O[0]-sh)/px)-1,i1=Math.ceil((bb.x1-O[0]-sh)/px)+1;
   for(let i=i0;i<=i1;i++){const cx=O[0]+sh+i*px,poly=[];for(let k=0;k<6;k++){const a=Math.PI/6+k*Math.PI/3;poly.push([cx+s*Math.cos(a),cy+s*Math.sin(a)]);}
    out.push({x0:cx-F/2,y0:cy-s,lw:F,lh:2*s,poly,k:'p',q:mod(i+j,2)});}}
  return out;}

  for(let i=i0;i<=i1;i++){const x0=O[0]+i*px,odd=mod(i,2)===1,yl=odd?rise:0,yr=odd?0:rise;
   const j0=Math.floor((bb.y0-O[1]-rise)/py)-1,j1=Math.ceil((bb.y1-O[1])/py)+1;
   for(let j=j0;j<=j1;j++){const y=O[1]+j*py;out.push({x0,y0:y,lw:cw,lh:eh+rise,poly:[[x0,y+yl],[x0+cw,y+yr],[x0+cw,y+yr+eh],[x0,y+yl+eh]],k:'p',q:mod(j,2)});}}

   const x=O[0]+k*A+m*B,y=O[1]+k*A-m*B;R(x,y,L,Wd,kind,0);R(x+B,y-(L-Wd),Wd,L,kind,1);}

function cellBox(C,holes,x0,y0,x1,y1){
 const xs=new Set([x0,x1]),ys=new Set([y0,y1]);C.forEach(q=>{xs.add(q[0]);ys.add(q[1]);});
 holes.forEach(h=>h.L.forEach(v=>{if(v[0]>x0&&v[0]<x1)xs.add(v[0]);if(v[1]>y0&&v[1]<y1)ys.add(v[1]);}));
 const X=[...xs].sort((a,b)=>a-b),Yv=[...ys].sort((a,b)=>a-b);let bb=null,big=0,lp=null;
 for(let i=0;i<X.length-1;i++){if(X[i+1]-X[i]<1e-4)continue;for(let j=0;j<Yv.length-1;j++){if(Yv[j+1]-Yv[j]<1e-4)continue;
  const cx=(X[i]+X[i+1])/2,cy=(Yv[j]+Yv[j+1])/2;if(!pip(C,cx,cy))continue;
  if(holes.some(h=>cx>h.bb.x0&&cx<h.bb.x1&&cy>h.bb.y0&&cy<h.bb.y1&&pip(h.L,cx,cy)))continue;
  const ca=(X[i+1]-X[i])*(Yv[j+1]-Yv[j]);if(ca>big){big=ca;lp=[cx,cy,X[i+1]-X[i],Yv[j+1]-Yv[j]];}
  if(!bb)bb={x0:X[i],y0:Yv[j],x1:X[i+1],y1:Yv[j+1]};else{bb.x0=Math.min(bb.x0,X[i]);bb.y0=Math.min(bb.y0,Yv[j]);bb.x1=Math.max(bb.x1,X[i+1]);bb.y1=Math.max(bb.y1,Yv[j+1]);}}}

function pieces(region,holes,T,niche,bot){
 const bb=bboxOf(region),gap=+P.edgeGap||0,out=[];
 const tiles=genTiles(T,bb);if(!tiles)return null;
 for(const t of tiles){const x1=t.x0+t.lw,y1=t.y0+t.lh;
  if(x1<=bb.x0+EPS||t.x0>=bb.x1-EPS||y1<=bb.y0+EPS||t.y0>=bb.y1-EPS)continue;
  const tp=t.poly||rectPoly(t.x0,t.y0,t.lw,t.lh);
  const C=clipConvex(region,tp);if(C.length<3)continue;let a=polyArea(C);if(a<0.02)continue;
  let hit=false,hl=null;
  for(const h of holes){const hb=h.bb;if(hb.x0<x1-EPS&&hb.x1>t.x0+EPS&&hb.y0<y1-EPS&&hb.y1>t.y0+EPS&&h.P.length>=3){const hp=clipConvex(h.P,tp);const ha=polyArea(hp);if(ha>1e-3){a-=ha;hit=true;(hl=hl||[]).push(h.type);}}}
  if(a<0.02)continue;
  const b=hit?cellBox(C,holes,t.x0,t.y0,x1,y1):bboxOf(C);if(!b)continue;
  const ta=t.poly?polyArea(t.poly):t.lw*t.lh,bw=b.x1-b.x0,bh=b.y1-b.y0,isR=t.k!=='p';
  let cL=b.x0>t.x0+EPS,cR=b.x1<x1-EPS,cB=b.y0>t.y0+EPS,cT=b.y1<y1-EPS,notch,full;
  if(isR){notch=a<bw*bh*0.985;full=!cL&&!cR&&!cB&&!cT&&!notch;}
  else{full=a>=ta*0.995;if(full)cL=cR=cB=cT=false;notch=!full;}
  const cw=isR?Math.max(0,bw-gap*((cL?1:0)+(cR?1:0))):bw,ch=isR?Math.max(0,bh-gap*((cB?1:0)+(cT?1:0))):bh;
  let taper=null,chv=ch;
  if(bot&&isR&&cB&&!hit){const xa=b.x0+0.02,xb=b.x1-0.02,ya=bot(xa),yb=bot(xb);if(Math.max(ya,yb)>t.y0+EPS){
   const hs=[xa,xb];const sw2=bot.mid;if(sw2!=null&&sw2>xa&&sw2<xb)hs.push(sw2);
   const H=hs.map(x=>b.y1-Math.max(bot(x),t.y0)-gap-(cT?gap:0));const hL=H[0],hR=H[1];
   if(Math.max(...H)-Math.min(...H)>1/32){taper=H.length===3?[hL,H[2],hR]:[hL,hR];chv=Math.min(...H);notch=false;full=false;}}}

const RANK={full:0,cut:1,warn:2,bad:3};
function cls(p){if(p.full)return'full';

function viewItems(){

  return ws.map(s=>{const R=compute(s),w=R.G.bb.x1-R.G.bb.x0,it={s,R,dx:x-R.G.bb.x0,dy:+s.base||0};x+=w+gap;return it;});}

function buildView(Wpx,Hpx,v,fs){

 let bb={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
 for(const it of items){const b=it.R.G.bb;let y0=b.y0;if(it.s.type==='pan'&&it.s.curb.on)y0=Math.min(y0,-it.s.curb.w);
  bb.x0=Math.min(bb.x0,b.x0+it.dx);bb.x1=Math.max(bb.x1,b.x1+it.dx);bb.y0=Math.min(bb.y0,y0+it.dy);bb.y1=Math.max(bb.y1,b.y1+it.dy);}
 if(all)bb.y0=Math.min(bb.y0,0);
 const span=Math.max(bb.x1-bb.x0,bb.y1-bb.y0,12),m=span*0.09+4;
 let vw=(bb.x1-bb.x0+2*m)/v.zoom,vh=(bb.y1-bb.y0+2*m+(all?m*0.5:0))/v.zoom;
 if(!Hpx)Hpx=Wpx*vh/vw;const ar=Wpx/Hpx;if(vw/vh<ar)vw=vh*ar;else vh=vw/ar;
 const cx=(bb.x0+bb.x1)/2+v.panX,cy=(bb.y0+bb.y1)/2+(all?m*0.25:0)+v.panY,upp=vw/Wpx;
 const vb=[cx-vw/2,-(cy+vh/2),vw,vh];
 let body=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#fbfaf7"/>`;
 items.forEach((it,i)=>{body+=`<g transform="translate(${it.dx} ${-it.dy})">${surfBody(it.s,it.R,{upp,fs,id:'s'+i,m:all?m*0.6:m,dimV:!all,title:all})}</g>`;
  it.x0=it.R.G.bb.x0+it.dx;it.x1=it.R.G.bb.x1+it.dx;});
 if(all){body+=`<line x1="${bb.x0-m*0.3}" x2="${bb.x1+m*0.3}" y1="0" y2="0" stroke="#24272b" stroke-width="${(1.2*upp).toFixed(4)}" stroke-dasharray="${(6*upp).toFixed(3)} ${(3*upp).toFixed(3)}"/>`;}
 return{vb,body,Hpx,items,upp};}

const ptrs=new Map();let drag=null,pinch=null;
const dist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;};
function hitItem(clientX){const r=svg.getBoundingClientRect(),wx=S.vb[0]+(clientX-r.left)*S.upp;return S.items.find(it=>wx>=it.x0&&wx<=it.x1)||null;}
function startDrag(x,y){const it=S.tab==='all'?hitItem(x):(S.items[0]||null);const s=it?it.s:null;const T=s?effT(s):null;

svg.addEventListener('pointerdown',e=>{if(S.tab==='tot')return;svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1)startDrag(e.clientX,e.clientY);else if(ptrs.size===2){pinch={d:dist(),z:S.view.zoom};drag=null;}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size>=2){S.view.zoom=Math.min(14,Math.max(0.4,pinch.z*dist()/pinch.d));drawSoon();return;}
 if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;if(!drag.moved)return;
 const dx=(e.clientX-drag.x)*drag.upp,dy=(e.clientY-drag.y)*drag.upp;
 if(S.mode==='tiles'&&!S.client&&drag.s){const sn=v=>Math.round(v*16)/16;setO(drag.s,sn(drag.ox+dx),sn(drag.oy-dy));}
 else{S.view.panX=drag.px-dx;S.view.panY=drag.py+dy;}
 drawSoon();});
function pEnd(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
 if(ptrs.size===1){const a=[...ptrs.values()][0];startDrag(a.x,a.y);drag.moved=true;return;}
 if(ptrs.size===0&&drag){const d=drag;drag=null;
  if(!d.moved){if(S.tab==='all'&&d.it&&!S.client){S.tab=P.surfaces.indexOf(d.it.s);S.view={zoom:1,panX:0,panY:0};renderAll();}return;}
  if(d.s&&S.mode==='tiles'&&!S.client){normalizeS(d.s);changed();}}}
svg.addEventListener('pointerup',pEnd);svg.addEventListener('pointercancel',pEnd);
svg.addEventListener('wheel',e=>{e.preventDefault();S.view.zoom=Math.min(14,Math.max(0.4,S.view.zoom*(e.deltaY<0?1.12:1/1.12)));drawSoon();},{passive:false});

function renderLegend(){$('#legend').innerHTML=[['full','legFull'],['cut','legCut'],['warn','legWarn'],['bad','legBad']].map(([c,k])=>`<span><i style="background:${COL[c]}"></i>${t(k)}${c==='bad'?' ('+fmt(+P.minCut)+')':''}</span>`).join('')+`<span><i style="background:#c9bfae"></i>${t('legNiche')}</span><span><i style="background:#c3c8d0"></i>Schluter</span>`;}
function aggItems(){const a={full:0,cuts:0,need:0,order:0,minc:1e9,bad:0,sheets:0};for(const it of S.items){const r=it.R;a.full+=r.full;a.cuts+=r.cuts;a.need+=r.need;a.order+=r.order;a.minc=Math.min(a.minc,r.minc);a.bad+=r.bad;}return a;}
function renderStat(){const el=$('#stat');
 if(S.tab==='all'){if(!S.items.length){el.innerHTML='';return;}const a=aggItems();
  el.innerHTML=`<span>${t('full')} <b>${a.full}</b></span><span>${t('cuts')} <b>${a.cuts}</b></span><span class="${a.bad?'bad':''}">${t('minCut')} <b>${a.minc<1e8?fmt(a.minc):'—'}</b></span><span>${t('need')} <b>${a.need}</b></span><span>${t('order')} <b>${a.order}</b></span>`;if(S.client)renderClient();return;}
 if(!R||!cur()){el.innerHTML=R===null&&cur()?`<span class="bad">${t('tooMany')}</span>`:'';return;}
 const sheet=R.T.sheet&&R.T.sheet.on;
 el.innerHTML=sheet?`<span>${t('sheets')} <b>${R.sheets}</b></span><span>${t('order')} <b>${R.order}</b></span><span>${t('area')} <b>${sq(R.area)}</b></span>`:
 `<span>${t('full')} <b>${R.full}</b></span><span>${t('cuts')} <b>${R.cuts}</b></span><span class="${R.bad?'bad':''}">${t('minCut')} <b>${R.minc<1e8?fmt(R.minc):'—'}</b></span><span>${t('need')} <b>${R.need}</b></span><span>${t('order')} <b>${R.order}</b></span>`;
 if(S.client)renderClient();}
function patName(T){const p=patOf(T);let n=p==='hex'?t('shex'):p==='chevron'?t('schevron'):t('p'+p);if(p==='offset'||p==='voffset')n+=' '+Math.round((+T.off)*100)+'%';if(+T.ang)n+=', '+(+T.ang)+'°';if(T.checker)n+=', '+t('checker');return n;}
function renderClient(){const el=$('#clientCard');
 if(S.tab==='all'){const ws=S.items.map(it=>`<b>${esc(it.s.name)}</b> — ${fmt(it.R.G.bb.x1-it.R.G.bb.x0)} × ${fmt(it.R.G.bb.y1-it.R.G.bb.y0)}`).join('<br>');
  const T=S.items[0]?S.items[0].R.T:null;el.innerHTML=`<div class="cc">${ws}${T?`<br>${t('tile')}: ${esc(tileDesc(T))}, ${esc(patName(T))}, ${t('grout')} ${fmt(+T.g)}`:''}</div>`;return;}
 const s=cur();if(!s||!R){el.innerHTML='';return;}const T=R.T;
 el.innerHTML=`<div class="cc"><b>${esc(s.name)}</b> — ${fmt(R.G.bb.x1-R.G.bb.x0)} × ${fmt(R.G.bb.y1-R.G.bb.y0)}<br>${t('tile')}: ${esc(tileDesc(T))}, ${esc(patName(T))}, ${t('grout')} ${fmt(+T.g)}<br>${R.lf>0?`Schluter ${esc(P.sch.profile)} ${esc(P.sch.size)}<br>`:''}${t('area')}: ${sq(R.area)}</div>`;}

const F=(label,k,ty='len',sc='s',cls='')=>{const base=sc==='p'?P:cur();let v;
 if(k==='_ox'||k==='_oy')v=offs(cur())[k==='_ox'?'x':'y'];else if(k==='_offp')v=Math.round(+cur().tile.off*1000)/10;else v=getPath(base,k);
 const val=ty==='len'?fmtIn(v):ty==='num'?(v==null?'':v):esc(v);
 return`<label class="f ${cls}"><span>${label}</span><input data-k="${k}" data-sc="${sc}" data-t="${ty}" value="${val}" autocomplete="off" ${ty==='num'?'inputmode="decimal"':''}></label>`;};
const SEL=(label,k,opts,rb,sc='s',cls='',lab)=>{const base=sc==='p'?P:cur();const v=getPath(base,k);return`<label class="f ${cls}"><span>${label}</span><select data-k="${k}" data-sc="${sc}" data-t="sel" ${rb?'data-rb="1"':''}>${opts.map(o=>`<option value="${o}" ${o===v?'selected':''}>${esc(lab?lab(o):t(o==='L'?'Lshape':o))}</option>`).join('')}</select></label>`;};
const CHK=(label,k,rb,sc='s')=>{const base=sc==='p'?P:cur();return`<label class="c"><input type="checkbox" data-k="${k}" data-sc="${sc}" data-t="chk" ${getPath(base,k)?'checked':''} ${rb?'data-rb="1"':''}>${label}</label>`;};
const SEC=(id,title,body)=>`<details data-sec="${id}" ${S.open.has(id)?'open':''}><summary>${title}</summary><div class="bd">${body}</div></details>`;
function offs(s){const T=effT(s),G=geom(s),per=periodOf(T)||{};return{x:per.x?mod(T.ox-G.rb.x0,per.x):T.ox-G.rb.x0,y:per.y?mod(T.oy-G.rb.y0,per.y):T.oy-G.rb.y0};}
function syncOff(){const s=cur();if(!s)return;document.querySelectorAll('#panel [data-k="_ox"],#panel [data-k="_oy"]').forEach(el=>{if(document.activeElement===el)return;const o=offs(s);el.value=fmtIn(el.dataset.k==='_ox'?o.x:o.y);el.classList.remove('bad');});}

function tileSection(s){const T=s.tile,pat=patOf(T),sh=T.shape,{tw,th}=rdims(T);
 let b=`<div class="btns"><button class="btn p w" data-act="gallery">${t('gallery')}</button></div><div class="grid">${SEL(t('tileShape'),'tile.shape',['rect','hex','penny','chevron'],1,'s','w2',o=>t('s'+o))}`;
 if(sh==='rect')b+=SEL(t('pattern'),'tile.pattern',['grid','offset','voffset','herring','basket','pinwheel'],1,'s','w2',o=>t('p'+o));
 if(sh==='penny')b+=SEL(t('pattern'),'tile.pattern',['grid','offset'],1,'s','w2',o=>t('p'+o));
 if(sh==='rect'&&pat==='pinwheel')b+=F(t('bigSq'),'tile.w')+F(t('smallSq'),'tile.w2');
 else if(sh==='rect')b+=F(t('tileW'),'tile.w')+F(t('tileL'),'tile.h');
 if(sh==='hex')b+=F(t('hexW'),'tile.w','len','s','w2');
 if(sh==='penny')b+=F(t('pennyD'),'tile.w','len','s','w2');
 if(sh==='chevron')b+=F(t('chevW'),'tile.w')+F(t('chevH'),'tile.h')+F(t('chevA'),'tile.cang','num');
 b+=`<div class="w2">${F(t('grout'),'tile.g')}<div class="chips">${[1/16,1/8,3/16,1/4].map(g=>`<button class="btn sm" data-act="grout:${g}">${fmtIn(g)}</button>`).join('')}</div></div>`;
 if(pat==='offset'||pat==='voffset')b+=`<div class="w2">${F(t('offPct'),'_offp','num')}<div class="chips">${[[1/2,'1/2'],[1/3,'1/3'],[1/4,'1/4'],[0.2,'20%']].map(([v,l])=>`<button class="btn sm ${Math.abs(T.off-v)<1e-6?'p':''}" data-act="off:${v}">${l}</button>`).join('')}</div></div>`;
 b+=`<div class="w2">${F(t('angle'),'tile.ang','num')}<div class="chips">${[0,45,90,30,60].map(a=>`<button class="btn sm ${+T.ang===a?'p':''}" data-act="ang:${a}">${a}°</button>`).join('')}</div></div></div>`;
 if(sh==='rect'||sh==='hex')b+=`<div class="btns"><button class="btn" data-act="rotate">${t('rotate')}</button></div>`;
 if(sh==='rect'&&pat!=='pinwheel')b+=`<p class="hint">${t('orient')}: <b>${fmtIn(tw)} × ${fmtIn(th)}</b> (${tw>=th?t('horiz'):t('vert')})</p>`;
 if(pat==='basket'){const L=Math.max(tw,th),W=Math.min(tw,th),g=+T.g,n=Math.round((L+g)/(W+g));if(Math.abs(L-(n*W+(n-1)*g))>0.07)b+=`<div class="note">${t('basketWarn')}</div>`;}
 if(sh==='rect'&&(pat==='grid'||pat==='offset'))b+=CHK(t('checker'),'tile.checker');
 b+=CHK(t('sheetOn'),'tile.sheet.on',1);
 if(T.sheet.on)b+=`<div class="grid">${F(t('sheetW'),'tile.sheet.w')}${F(t('sheetH'),'tile.sheet.h')}</div>`;
 b+=`<div class="grid" style="margin-top:6px">${F(t('sqftBox'),'tile.sqftBox','num')}</div><div class="btns"><button class="btn" data-act="applyAll">${t('applyAll')}</button></div>`;
 return SEC('tile',`${t('tile')} · ${esc(tileDesc(T))}`,b);}

 let b=`<div class="op"><div class="grid">${SEL(t('type'),`openings.${i}.type`,types,1,'s','w2')}`;
 if(circ)b+=F(t('cx'),`openings.${i}.x`)+F(t('cy'),`openings.${i}.y`)+F(t('dia'),`openings.${i}.dia`);
 else b+=F(t('fromLeft'),`openings.${i}.x`)+F(t('fromBottom'),`openings.${i}.y`)+F(t('width'),`openings.${i}.w`)+F(t('height'),`openings.${i}.h`);
 if(o.type==='niche')b+=F(t('depth'),`openings.${i}.d`);
 b+='</div>';if(TRIMMABLE[o.type])b+=CHK(t('trimmed'),`openings.${i}.trim`);
 b+=`<div class="btns">${o.type==='niche'?`<button class="btn sm" data-act="snap:${i}">${t('snap')}</button>`:''}<button class="btn sm d" data-act="delOpen:${i}">${t('del')}</button></div></div>`;return b;}

function renderPanel(){
 const el=$('#panel');document.body.classList.toggle('tot',S.tab==='tot');
 if(S.tab==='tot'){el.innerHTML=SEC('proj',t('proj'),`<div class="grid">${F(t('projName'),'name','text','p','w2')}${F(t('clientName'),'client','text','p','w2')}${F(t('waste'),'waste','num','p')}${F(t('minCutS'),'minCut','len','p')}${F(t('edgeGap'),'edgeGap','len','p')}${F(t('kerf'),'kerf','len','p')}${F(t('schProfile'),'sch.profile','text','p')}${F(t('schSize'),'sch.size','text','p')}${F(t('schVis'),'sch.vis','len','p')}</div><p class="hint">${t('storeNote')}</p>`)+SEC('tot',t('totTitle'),'<div id="tot"></div>');renderTot();return;}

  let b=`<p class="hint">${t('tapWall')}</p><div class="grid">${SEL(t('linkMode'),'link.mode',['none','height','wrap'],1,'p','w2',o=>t('l'+o))}</div><p class="hint">${t('linkHint')}</p>`;
  b+=ws.map(s=>{const i=P.surfaces.indexOf(s);return`<div class="op"><h4>${esc(s.name)} · ${fmt(wallW(s))}</h4><div class="grid">${F(t('base'),`surfaces.${i}.base`,'len','p')}<div>${CHK(t('linked'),`surfaces.${i}.link`,1,'p')}</div></div></div>`;}).join('');
  b+=`<div class="btns"><button class="btn p" data-act="autoAll">${t('autoAll')}</button><button class="btn" data-act="tileToAll">${t('tileToAll')}</button></div>`;
  el.innerHTML=SEC('link',t('link'),b)+SEC('allres',t('results'),'<div id="res"></div>');renderRes();return;}
 const s=cur();if(!s){el.innerHTML='';return;}
 let h='';
 let sb=`<div class="grid">${F(t('name'),'name','text','s','w2')}${SEL(t('type'),'type',['wall','floor','pan'],1)}${SEL(t('shape'),'shape',['rect','L','custom'],1)}`;
 if(s.shape!=='custom')sb+=F(t('width'),'w')+F(s.type==='wall'?t('height'):t('length'),'h');
 if(s.shape==='L')sb+=F(t('notchW'),'Lw')+F(t('notchH'),'Lh')+SEL(t('corner'),'Lc',['tr','tl','br','bl'],0,'s','w2');
 sb+='</div>';
 if(s.shape==='custom')sb+=`<label class="f" style="margin-top:8px"><span>${t('ptsHint')}</span><textarea rows="3" data-k="pts" data-sc="s" data-t="text">${esc(s.pts)}</textarea></label>`;
 if(s.type==='wall')sb+=`<div class="grid" style="margin-top:8px">${F(t('base'),'base')}<div>${P.link.mode!=='none'?CHK(t('linked'),'link',1):''}</div></div>`;
 if(s.type==='wall'&&s.shape==='rect'){s.uneven=s.uneven||{on:false,l:0,r:0,m:0,mOn:false};sb+=`<div class="op" style="margin-top:8px">${CHK(t('unevenOn'),'uneven.on',1)}`;
  if(s.uneven.on)sb+=`<p class="hint">${t('unevenHint')}</p><div class="grid">${F(t('uL'),'uneven.l')}${F(t('uR'),'uneven.r')}</div>${CHK(t('uMidOn'),'uneven.mOn',1)}${s.uneven.mOn?`<div class="grid">${F(t('uM'),'uneven.m')}</div>`:''}`;
  sb+='</div>';}
 sb+=`<div class="btns"><button class="btn d" data-act="delSurf">${t('delSurf')}</button></div>`;
 h+=SEC('surf',t('surface'),sb);
 h+=tileSection(s);
 const dr=s.type==='pan'&&s.drain.type==='center';
 h+=SEC('layout',t('layout'),`<p class="hint">${t('dragHint')}</p><div class="btns"><button class="btn p" data-act="auto">${t('auto')}</button><button class="btn" data-act="cTile">${t('cTile')}</button><button class="btn" data-act="cJoint">${t('cJoint')}</button><button class="btn" data-act="corner0">${t('corner0')}</button>${dr?`<button class="btn" data-act="dTile">${t('dTile')}</button><button class="btn" data-act="dJoint">${t('dJoint')}</button>`:''}</div>
 <p class="hint">${t('autoHint')}</p>
 <div class="row"><div class="pad"><span></span><button class="btn" data-act="nudge:u">↑</button><span></span><button class="btn" data-act="nudge:l">←</button><button class="btn" data-act="nudge:d">↓</button><button class="btn" data-act="nudge:r">→</button></div>
 <div><span class="hint">${t('step')}</span><div class="chips">${[1/16,1/8,1/4,1/2,1].map(v=>`<button class="btn sm ${S.step===v?'p':''}" data-act="step:${v}">${fmtIn(v)}</button>`).join('')}</div></div></div>
 <div class="grid" style="margin-top:8px">${F(t('offX'),'_ox')}${F(t('offY'),'_oy')}</div>`);
 h+=SEC('open',`${t('openings')}${s.openings.length?' · '+s.openings.length:''}`,s.openings.map(openingCard).join('')+`<div class="btns"><button class="btn p" data-act="addOpenMenu">${t('addOpen')}</button></div>`);
 h+=SEC('edges',t('edges'),(s.shape==='rect'?`<p class="hint">${t('edgeHint')}</p><div class="grid">${CHK(t('edgeL'),'trim.l')}${CHK(t('edgeR'),'trim.r')}${CHK(t('edgeT'),'trim.t')}${CHK(t('edgeB'),'trim.b')}</div>`:`<p class="hint">${t('edgeNonRect')}</p>`)+`<div class="grid">${F(t('extraLF'),'extraLF')}</div><p class="hint">${esc(P.sch.profile)} ${esc(P.sch.size)} · ${t('schVis')}: ${fmt(+P.sch.vis)}</p>`);
 if(s.type==='pan'){const d=s.drain;
  h+=SEC('pan',t('panSec'),`${CHK(t('curbOn'),'curb.on',1)}${s.curb.on?`<div class="grid">${F(t('curbLen'),'curb.len')}${F(t('curbW'),'curb.w')}${F(t('curbH'),'curb.h')}</div>${CHK(t('curbTrim'),'curb.trim')}`:''}
  <div class="grid">${SEL(t('drain'),'drain.type',['none','center','linear'],1,'s','w2')}${d.type!=='none'?F(t('drainX'),'drain.x')+F(t('drainY'),'drain.y'):''}${d.type==='linear'?F(t('drainLen'),'drain.len')+F(t('drainWid'),'drain.wid'):''}</div>`);}
 h+=SEC('res',t('results'),'<div id="res"></div>');
 el.innerHTML=h;renderRes();}

function stripTxt(x){if(x.approx)return`${x.label}: ${fmt(x.wid)} × ${fmt(x.len)} ×${x.faces} ≈ ${x.tiles} ${t('tilesShort')}`;return`${x.label}: ${fmt(x.wid)} × ${x.per>1?`${x.per-1}×${fmt(x.Lg)} + ${fmt(x.last)}`:fmt(x.last)}, ×${x.faces} → ${x.count} ${t('pcs')}`;}
function drillTxt(d){const nm=t(d.o.type)+(d.o.shape==='circle'?' ⌀'+fmtIn(d.o.dia):' '+fmtIn(d.o.w)+'×'+fmtIn(d.o.h));
 if(d.joint)return`${nm}: ${t('onJoint')}`;
 return`${nm}: ${t('drillPiece')} ${fmtIn(d.p.cw)}×${fmtIn(d.p.ch)} — ${t('drillFrom')} <b>${fmt(d.dx)}</b> ${t('fromL')}, <b>${fmt(d.dy)}</b> ${t('fromB')}${d.cross?` <span style="color:#b3261e">(${t('crosses')})</span>`:''}`;}
function kpis(r,T){const sheet=T&&T.sheet&&T.sheet.on;const nbKeys=Object.keys(r.nb||{});
 let h=`<div class="kp"><div><small>${t('area')}</small><b>${sq(r.area)}</b></div>`+(sheet?`<div><small>${t('sheets')}</small><b>${r.sheets}</b></div><div><small>${t('cuts')}</small><b>${r.cuts}</b></div>`:`<div><small>${t('full')}</small><b>${r.full}</b></div><div><small>${t('cuts')}</small><b>${r.cuts}</b></div>`)+
 `<div><small>${sheet?t('sheets'):t('need')}</small><b>${r.need}</b></div><div class="hl"><small>${t('order')} (+${P.waste}%)</small><b>${r.order}</b></div><div><small>${t('boxes')}</small><b>${r.boxes||'—'}</b></div></div>`;
 if(nbKeys.length>1)h+=`<table>${nbKeys.map(k=>`<tr><td>${esc(k)}</td><td class="n">${r.nb[k]} → <b>${Math.ceil(r.nb[k]*(1+(+P.waste||0)/100))}</b></td></tr>`).join('')}</table>`;
 return h;}
function renderRes(){const el=$('#res');if(!el)return;
 if(S.tab==='all'){const items=S.items;if(!items.length){el.innerHTML='';return;}
  const comb={};let lf=0;items.forEach(it=>{lf+=it.R.lf;it.R.list.forEach(r=>{const e=comb[r.k]||(comb[r.k]={k:r.k,n:0,c:r.c,cw:r.cw,ch:r.ch});e.n+=r.n;if(RANK[r.c]>RANK[e.c])e.c=r.c;});});
  let h=`<table><tr><th>${t('wall')}</th><th class="n">${t('full')}</th><th class="n">${t('cuts')}</th><th class="n">${t('minCut')}</th><th class="n">${t('need')}</th></tr>${items.map(it=>`<tr><td>${esc(it.s.name)}${isLinked(it.s)?' 🔗':''}</td><td class="n">${it.R.full}</td><td class="n">${it.R.cuts}</td><td class="n" style="${it.R.bad?'color:#b3261e;font-weight:600':''}">${it.R.minc<1e8?fmtIn(it.R.minc):'—'}</td><td class="n">${it.R.need}</td></tr>`).join('')}</table>`;
  const a=aggItems();h+=`<p><b>${t('total')}</b>: ${t('need')} ${a.need} → ${t('order')} <b>${a.order}</b>${lf>0?` · Schluter ${(lf/12).toFixed(1)} ft (${Math.ceil(lf/98.5)} ${t('sticks')})`:''}</p>`;
  const list=Object.values(comb).sort((a,b)=>RANK[b.c]-RANK[a.c]||a.cw*a.ch-b.cw*b.ch);
  if(list.length)h+=`<p style="margin:10px 0 4px"><b>${t('combined')}</b></p><table><tr><th>${t('size')}</th><th class="n">${t('qty')}</th></tr>${list.map(r=>`<tr><td><span class="sw" style="background:${COL[r.c]}"></span>${esc(r.k)}</td><td class="n">${r.n}</td></tr>`).join('')}</table>`;
  h+=`<div class="btns"><button class="btn" data-act="copyCuts">${t('copyCuts')}</button></div>`;el.innerHTML=h;return;}
 if(!R){el.innerHTML=`<div class="warnbox">${t('tooMany')}</div>`;return;}
 const T=R.T,sticks=Math.ceil(R.lf/98.5);let h=kpis(R,T);
 if(R.bad)h+=`<div class="warnbox">${R.bad} ${t('sliverWarn')}</div>`;
 if(R.ledger){const L=R.ledger,s0=cur();h+=`<div class="note"><b>${t('outLevel')}</b>: ${fmt(L.hi-L.lo)} ${t('onLen')} ${fmt(s0.w)}.${L.y!=null?` ${t('ledgerTxt')} <b>${fmt(L.y)}</b> ${t('ledgerFrom')}`:''} ${t('taperNote')}</div>`;}
 if(R.list.length)h+=`<table><tr><th>${t('size')}</th><th class="n">${t('qty')}</th></tr>${R.list.map(r=>`<tr><td><span class="sw" style="background:${COL[r.c]}"></span>${esc(r.k)}</td><td class="n">${r.n}</td></tr>`).join('')}</table>`;
 if(R.drill.length)h+=`<p style="margin:12px 0 4px"><b>${t('drill')}</b></p>`+R.drill.map(d=>`<div class="dl">${drillTxt(d)}</div>`).join('');
 if(R.strips.length)h+=`<p style="margin:12px 0 4px"><b>${t('strips')}</b></p>`+R.strips.filter(x=>x.count||x.tiles).map(x=>`<div class="hint" style="color:var(--ink)">${esc(stripTxt(x))}</div>`).join('');
 if(R.lf>0)h+=`<p style="margin:10px 0 4px"><b>${t('sch')}</b>: ${fmt(R.lf)} = ${(R.lf/12).toFixed(1)} ft → ${sticks} ${t('sticks')}</p>`;
 h+=`<p class="hint">${t('gapNote')} (${fmt(+P.edgeGap)}). ${t('reuseNote')}</p><div class="btns"><button class="btn" data-act="copyCuts">${t('copyCuts')}</button></div>`;

 case'mode':S.mode=S.mode==='tiles'?'view':'tiles';renderTools();break;
 case'client':S.client=!S.client;if(S.client&&S.tab==='tot')S.tab=0;renderAll();break;
 case'lang':lang=lang==='ru'?'en':'ru';document.documentElement.lang=lang;saveSoon();renderAll();break;
 case'projects':projectsModal();break;
 case'closeModal':closeModal();break;
 case'newProj':{const p=newProject(false);DB.projects.push(p);P=p;S.tab=0;closeModal();renderAll();saveSoon();break;}
 case'openProj':P=DB.projects.find(p=>p.id===arg)||P;S.tab=0;S.view={zoom:1,panX:0,panY:0};closeModal();renderAll();saveSoon();break;
 case'dupProj':{const src=DB.projects.find(p=>p.id===arg);if(!src)return;const c=JSON.parse(JSON.stringify(src));c.id=uid();c.name+=' (2)';c.updated=Date.now();DB.projects.push(c);P=c;S.tab=0;saveSoon();projectsModal();renderAll();break;}
 case'delProj':if(!b.dataset.armed){b.dataset.armed=1;b.textContent=t('confirm');return;}DB.projects=DB.projects.filter(p=>p.id!==arg);if(P.id===arg)P=DB.projects[0];S.tab=0;saveSoon();projectsModal();renderAll();break;
 case'copyExp':copyText($('#expTxt').value,b);break;
 case'importProj':try{const d=JSON.parse($('#impTxt').value);const arr=Array.isArray(d)?d:d.projects?d.projects:[d];arr.forEach(p=>{if(!p||!Array.isArray(p.surfaces))throw 0;p.id=uid();migrate(p);DB.projects.push(p);P=p;});S.tab=0;closeModal();renderAll();saveSoon();}catch(e){b.textContent=t('importErr');}break;
 case'image':exportImage();break;
 case'copyCuts':copyText(cutsText(),b);break;
 }}
function autoLayoutX(s){const T0=effT(s),sp=spanOf(T0),T=effT(s),start=T.ox;if(P.link.mode==='wrap')return;let best=null;const N=Math.min(240,Math.max(8,Math.round(sp.x/0.125)));
 for(let k=0;k<N;k++){const v=start+sp.x*k/N;setO(s,v,T.oy);const r=scoreS(s,'x');const sc=Math.round(r.mn*16)*1000-r.sym;if(!best||sc>best.s+1e-9)best={s:sc,v};}
 setO(s,best.v,T.oy);normalizeS(s);}

/* ================= init ================= */
(function init(){
 const d=load();
 const nl=(navigator.language||'en').toLowerCase();const defL=/^(ru|uk|be)/.test(nl)?'ru':'en';
 if(d){DB=d;lang=d.lang||defL;}else{lang=defL;DB={v:2,lang,projects:[],curId:null};}
 DB.projects.forEach(migrate);
 if(!DB.projects.length){const p=newProject(true);DB.projects.push(p);}
 P=DB.projects.find(p=>p.id===DB.curId)||DB.projects[0];
 document.documentElement.lang=lang;renderAll();saveSoon();
})();
</script>
