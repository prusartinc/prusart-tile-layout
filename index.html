<body>
<header>
 <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0L100 50L50 100L0 50Z" fill="#fff"/><path d="M50 11L89 50L50 89L11 50Z" fill="#000"/><path d="M50 15.25L84.75 50L50 84.75L15.25 50Z" fill="#a8a390"/><path d="M50 23.6L76.4 50L50 76.4L23.6 50Z" fill="#000"/><path d="M50 32.35L67.65 50L50 67.65L32.35 50Z" fill="#fff"/></svg><div class="ttl"><b id="hT"></b><small id="hS"></small></div></div>
 <button data-act="lang" id="bLang"></button>
 <button data-act="projects" class="ed" id="bProj"></button>
 <button data-act="image" id="bImg"></button>
 <button data-act="client" class="acc" id="bCli"></button>
</header>
<div id="app">
 <section id="vw">
  <nav id="tabs"></nav>
  <div id="stage">
   <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
   <div id="tools"></div>
   <div id="layers"></div>
   <div id="sbar"></div>
   <div id="pad"><button class="stp" data-act="stepCycle">1/8″</button><button data-nudge="u">↑</button><span></span><button data-nudge="l">←</button><button data-nudge="d">↓</button><button data-nudge="r">→</button></div>
  </div>
  <div id="stat"></div>
  <div id="legend"></div>
  <div id="clientCard"></div>
 </section>
 <aside id="panel"></aside>
</div>
<div id="modal" hidden><div class="mbox" id="mbody"></div></div>
